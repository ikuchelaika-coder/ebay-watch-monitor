<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay ვინტაჟური საათების AI მონიტორი</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans Georgian', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #020617; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <script>
    const SUPABASE_URL = "https://mxcbyxvrabhwpzecugkx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_orsJWjVuw_BgYqfEJqV0qQ_JCx1Zsy7";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-30 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold">⌚</div>
        <div>
          <h1 class="text-base font-bold text-white">eBay ვინტაჟური საათების მონიტორი</h1>
          <p class="text-[11px] text-slate-400">ავტომატური სინქრონიზაცია • Gemini AI ფილტრი</p>
        </div>
      </div>
      <div class="flex items-center gap-2.5">
        <span id="syncStatus" class="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-3 py-1.5 rounded-lg">● მზადაა</span>
        <button onclick="loadData()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium border border-slate-700">🔄 განახლება</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- მარცხენა პანელი -->
    <aside class="lg:col-span-4 space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">

        <!-- 1. სიტყვის ჩაწერა + დამატება + ძიება ამავე გვერდზე -->
        <div class="space-y-2">
          <div class="relative">
            <input
              id="keywordInput"
              type="text"
              oninput="handleLiveSearch()"
              onkeydown="if(event.key==='Enter') searchOnSite()"
              placeholder="ჩაწერე სიტყვა..."
              class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 pr-8 text-xs text-white focus:border-amber-500 focus:outline-none"
            />
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">✕</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="addKeyword()" class="py-2 px-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs">
              + დამატება
            </button>
            <button onclick="searchOnSite()" class="py-2 px-3 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/40 font-bold text-xs">
              🔍 ძიება
            </button>
          </div>
        </div>

        <!-- 2. ჩამოსაშლელი და ჩამოსასქროლი სია -->
        <div class="border border-slate-800 rounded-xl bg-slate-950 overflow-hidden">
          <button
            type="button"
            onclick="toggleDropdown()"
            class="w-full px-3.5 py-2.5 flex items-center justify-between text-xs font-semibold text-slate-200 hover:bg-slate-900 transition"
          >
            <span>📂 შენახული სიტყვები (<span id="kwCount">0</span>)</span>
            <span id="dropdownIcon" class="text-amber-400 text-[10px]">▼ ჩამოშლა</span>
          </button>

          <div id="dropdownContent" class="hidden border-t border-slate-800 p-2">
            <div id="keywordsList" class="space-y-1 max-h-48 overflow-y-auto custom-scroll pr-1"></div>
          </div>
        </div>

        <!-- 3. ფოტოს ატვირთვა კომპიუტერიდან -->
        <div class="space-y-2 pt-1 border-t border-slate-800/80">
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-300 font-medium">ნიმუშის ფოტო (AI-სთვის)</span>
            <button id="clearPhotoBtn" onclick="clearPhoto()" class="hidden text-[11px] text-rose-400 hover:underline">წაშლა</button>
          </div>
          <label class="flex items-center justify-center gap-2 w-full py-2.5 px-3 rounded-xl border border-dashed border-slate-700 hover:border-amber-500 bg-slate-950 cursor-pointer text-xs text-slate-300 transition">
            <span>📷 აირჩიე ფოტო კომპიუტერიდან</span>
            <input id="photoFileInput" type="file" accept="image/*" onchange="handlePhotoUpload(event)" class="hidden" />
          </label>
          <div id="photoPreviewBox" class="hidden relative rounded-xl overflow-hidden border border-slate-700 h-28 bg-slate-950">
            <img id="photoPreviewImg" src="" class="w-full h-full object-contain" />
          </div>
        </div>

        <!-- 4. რეჟიმი -->
        <div class="pt-1 border-t border-slate-800/80">
          <select id="scanMode" onchange="autoSaveSettings()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-amber-500 focus:outline-none">
            <option value="new">⚡ მხოლოდ ახალდამატებულები</option>
            <option value="deep">🌐 ყველა გვერდი (იაფიც და ძვირიც)</option>
          </select>
        </div>

      </div>
    </aside>

    <!-- მარჯვენა სამუშაო დაფა -->
    <section class="lg:col-span-8 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 p-3 rounded-2xl">
        <div class="flex gap-2">
          <button id="tabNew" onclick="switchTab('new')" class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-slate-950">
            ✨ ახალი ნაპოვნი (<span id="newCount">0</span>)
          </button>
          <button id="tabArchived" onclick="switchTab('archived')" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700">
            📁 უკვე ნანახი (<span id="archivedCount">0</span>)
          </button>
        </div>

        <button id="archiveAllBtn" onclick="archiveAll()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-amber-400">
          ✓ გადაიტანე უკვე ნანახ სიაში
        </button>
      </div>

      <!-- აქტიური ფილტრის მაჩვენებელი -->
      <div id="activeFilterBanner" class="hidden flex items-center justify-between bg-sky-500/10 border border-sky-500/30 px-4 py-2 rounded-xl text-xs text-sky-300">
        <span>🔎 ნაჩვენებია შედეგები სიტყვისთვის: <strong id="activeFilterText"></strong></span>
        <button onclick="clearSearch()" class="text-sky-400 hover:underline font-bold">✕ ფილტრის მოხსნა</button>
      </div>

      <div id="lotsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </main>

  <script>
    let currentTab = 'new';
    let allLots = [];
    let keywords = [];
    let refImageData = '';
    let dropdownOpen = false;
    let activeSearchQuery = '';

    function setStatus(msg, ok = true) {
      const el = document.getElementById('syncStatus');
      el.textContent = msg;
      el.className = ok
        ? 'text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-3 py-1.5 rounded-lg'
        : 'text-xs text-amber-400 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-lg';
    }

    async function loadData() {
      setStatus('⏳ იტვირთება...', false);
      const { data: settings } = await db.from('app_settings').select('*').eq('id', 1).single();
      if (settings) {
        keywords = Array.isArray(settings.keywords) ? settings.keywords : [];
        refImageData = settings.reference_image_url || '';
        document.getElementById('scanMode').value = settings.scan_mode || 'new';
        updatePhotoPreview();
        renderKeywords();
      }

      const { data: lots } = await db.from('watch_lots').select('*').order('found_at', { ascending: false });
      allLots = lots || [];
      renderLots();
      setStatus('● განახლებულია', true);
    }

    async function autoSaveSettings() {
      setStatus('⏳ ინახება...', false);
      const mode = document.getElementById('scanMode').value;
      await db.from('app_settings').upsert({
        id: 1,
        keywords: keywords,
        reference_image_url: refImageData,
        scan_mode: mode
      });
      setStatus('✓ ავტომატურად შენახულია', true);
    }

    function toggleDropdown() {
      dropdownOpen = !dropdownOpen;
      document.getElementById('dropdownContent').classList.toggle('hidden', !dropdownOpen);
      document.getElementById('dropdownIcon').textContent = dropdownOpen ? '▲ აკეცვა' : '▼ ჩამოშლა';
    }

    function handleLiveSearch() {
      const val = document.getElementById('keywordInput').value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !val);
      renderKeywords();
    }

    function searchOnSite(specificWord = null) {
      const val = specificWord !== null ? specificWord : document.getElementById('keywordInput').value.trim();
      if (specificWord !== null) {
        document.getElementById('keywordInput').value = specificWord;
        document.getElementById('clearSearchBtn').classList.remove('hidden');
      }
      activeSearchQuery = val;
      renderKeywords();
      renderLots();
    }

    function clearSearch() {
      document.getElementById('keywordInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      activeSearchQuery = '';
      renderKeywords();
      renderLots();
    }

    function renderKeywords() {
      const filter = document.getElementById('keywordInput').value.trim().toLowerCase();
      document.getElementById('kwCount').textContent = keywords.length;

      const list = keywords
        .map((text, idx) => ({ text, idx }))
        .filter(item => !filter || item.text.toLowerCase().includes(filter));

      const box = document.getElementById('keywordsList');
      if (!list.length) {
        box.innerHTML = '<div class="text-center py-3 text-[11px] text-slate-500">სიტყვა ვერ მოიძებნა</div>';
        return;
      }

      box.innerHTML = list.map(item => `
        <div class="flex items-center justify-between gap-2 bg-slate-900/90 border border-slate-800 px-2.5 py-1.5 rounded-lg text-xs">
          <button onclick="searchOnSite('${item.text.replace(/'/g, "\\'")}')" class="text-left text-slate-200 hover:text-amber-400 truncate flex-1" title="დააჭირე ამ სიტყვით გასაფილტრად">${item.text}</button>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="searchOnSite('${item.text.replace(/'/g, "\\'")}')" class="text-sky-400 hover:text-sky-300 text-[11px]" title="ძიება საიტზე">🔍</button>
            <button onclick="removeKeyword(${item.idx})" class="text-rose-400 hover:text-rose-300 font-bold text-xs" title="წაშლა">✕</button>
          </div>
        </div>
      `).join('');
    }

    async function addKeyword() {
      const input = document.getElementById('keywordInput');
      const val = input.value.trim();
      if (!val) return;
      if (!keywords.includes(val)) {
        keywords.unshift(val);
        await autoSaveSettings();
      }
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      activeSearchQuery = '';
      if (!dropdownOpen) toggleDropdown();
      renderKeywords();
      renderLots();
    }

    async function removeKeyword(idx) {
      keywords.splice(idx, 1);
      renderKeywords();
      await autoSaveSettings();
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const maxW = 500;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          refImageData = canvas.toDataURL('image/jpeg', 0.8);
          updatePhotoPreview();
          await autoSaveSettings();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updatePhotoPreview() {
      const box = document.getElementById('photoPreviewBox');
      const img = document.getElementById('photoPreviewImg');
      const btn = document.getElementById('clearPhotoBtn');
      if (refImageData) {
        img.src = refImageData;
        box.classList.remove('hidden');
        btn.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
        btn.classList.add('hidden');
      }
    }

    async function clearPhoto() {
      refImageData = '';
      document.getElementById('photoFileInput').value = '';
      updatePhotoPreview();
      await autoSaveSettings();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabNew').className = tab === 'new'
        ? 'px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-slate-950'
        : 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700';
      document.getElementById('tabArchived').className = tab === 'archived'
        ? 'px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-slate-950'
        : 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700';
      document.getElementById('archiveAllBtn').style.display = tab === 'new' ? 'block' : 'none';
      renderLots();
    }

    async function moveToArchive(id) {
      await db.from('watch_lots').update({ status: 'archived' }).eq('id', id);
      allLots = allLots.map(l => l.id === id ? { ...l, status: 'archived' } : l);
      renderLots();
    }

    async function archiveAll() {
      const newIds = allLots.filter(l => l.status === 'new').map(l => l.id);
      if (!newIds.length) return;
      await db.from('watch_lots').update({ status: 'archived' }).in('id', newIds);
      allLots = allLots.map(l => ({ ...l, status: 'archived' }));
      renderLots();
    }

    function renderLots() {
      const newLots = allLots.filter(l => l.status === 'new');
      const archivedLots = allLots.filter(l => l.status === 'archived');
      document.getElementById('newCount').textContent = newLots.length;
      document.getElementById('archivedCount').textContent = archivedLots.length;

      const banner = document.getElementById('activeFilterBanner');
      if (activeSearchQuery) {
        banner.classList.remove('hidden');
        document.getElementById('activeFilterText').textContent = activeSearchQuery;
      } else {
        banner.classList.add('hidden');
      }

      let list = currentTab === 'new' ? newLots : archivedLots;
      if (activeSearchQuery) {
        const q = activeSearchQuery.toLowerCase();
        list = list.filter(l => (l.title || '').toLowerCase().includes(q) || (l.ai_note || '').toLowerCase().includes(q));
      }

      const grid = document.getElementById('lotsGrid');
      if (!list.length) {
        grid.innerHTML = `<div class="col-span-full bg-slate-900/60 border border-dashed border-slate-800 rounded-2xl p-10 text-center text-sm text-slate-400">
          ${activeSearchQuery ? 'ამ სიტყვაზე პროდუქტი ვერ მოიძებნა.' : (currentTab === 'new' ? 'სამუშაო დაფა სუფთაა.' : 'არქივი ცარიელია.')}
        </div>`;
        return;
      }

      grid.innerHTML = list.map(lot => {
        const dateStr = new Date(lot.found_at).toLocaleString('ka-GE');
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between">
            <div>
              <div class="relative h-52 bg-slate-950">
                <img src="${lot.image_url}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/0f172a/fbbf24?text=No+Image'" />
                <span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-slate-950/90 text-amber-400 font-bold text-xs border border-amber-500/30">${lot.price || 'N/A'}</span>
              </div>
              <div class="p-4 space-y-2">
                <div class="text-[11px] text-slate-500">მოძებნილია: ${dateStr}</div>
                <h3 class="text-sm font-semibold text-white line-clamp-2">${lot.title}</h3>
                <p class="text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-800/40 p-2.5 rounded-xl">🤖 ${lot.ai_note || ''}</p>
              </div>
            </div>
            <div class="p-4 pt-0 flex gap-2">
              <a href="${lot.ebay_url}" target="_blank" class="flex-1 text-center py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs">eBay-ზე ნახვა ↗</a>
              ${currentTab === 'new' ? `<button onclick="moveToArchive(${lot.id})" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs">✓ ნანახია</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
